<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест — Деньги и Банки</title>
<style>
:root{--bg:#f3f7ff;--card:#ffffff;--ink:#0f1b3d;--mute:#51618a;--line:#cfdaf5;--acc:#2563eb;--acc2:#7c3aed;--ok:#0f9d4a;--okbg:#d4f8e2;--bad:#e11d48;--badbg:#ffdde5;--sel:#e0eaff;--g1:#7ddcff;--g2:#c3a6ff;--g3:#ffd98a;--shadow:0 14px 36px rgba(37,99,235,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f24;--card:#141b3a;--ink:#f1f5ff;--mute:#a9b7e0;--line:#2c3866;--acc:#4f8bff;--acc2:#9d6bff;--ok:#4ade80;--okbg:#0f3d27;--bad:#ff6b8a;--badbg:#4a1526;--sel:#212c5c;--g1:#0e7fb0;--g2:#6d3fd6;--g3:#b86a12;--shadow:0 14px 36px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f24;--card:#141b3a;--ink:#f1f5ff;--mute:#a9b7e0;--line:#2c3866;--acc:#4f8bff;--acc2:#9d6bff;--ok:#4ade80;--okbg:#0f3d27;--bad:#ff6b8a;--badbg:#4a1526;--sel:#212c5c;--g1:#0e7fb0;--g2:#6d3fd6;--g3:#b86a12;--shadow:0 14px 36px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(820px 540px at 4% -8%,var(--g1),transparent 62%),radial-gradient(780px 540px at 104% 0%,var(--g2),transparent 60%),radial-gradient(720px 500px at 50% 114%,var(--g3),transparent 62%),var(--bg);background-attachment:fixed}
main{max-width:900px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 18px;letter-spacing:-.02em;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.15rem;margin:26px 0 10px;font-weight:750}
.card{background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line));border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--ink);cursor:pointer;border-radius:14px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);padding:11px 18px;transition:transform .12s,box-shadow .12s,border-color .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,.20);border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:750;box-shadow:0 8px 20px rgba(79,70,229,.35)}
button.primary:hover:not(:disabled){border-color:transparent;box-shadow:0 10px 26px rgba(79,70,229,.5)}
button.big{width:100%;padding:16px 18px;font-size:1.12rem}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
input.name{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--ink);font:inherit;margin:0 0 14px}
input.name:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{color:var(--mute);font-size:.94rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.chips span{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,transparent),color-mix(in srgb,var(--acc2) 18%,transparent));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:650}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
.side{position:sticky;top:16px}
.side .card{padding:16px}
@media (max-width:720px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}}
.timer{display:block;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.45rem;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));padding:7px 14px;border-radius:14px;margin-bottom:12px}
.timer.low{background:linear-gradient(135deg,#ff3b5c,#ff7a3b)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:721px){.nums{grid-template-columns:repeat(5,1fr)}}
.nums button{padding:8px 0;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.nums button.has{background:var(--sel);border-color:var(--acc);color:var(--acc)}
.nums button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.nums button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.nums button.cur{outline:3px solid var(--acc2);outline-offset:1px}
.legend{margin:10px 0 12px;font-size:.8rem;color:var(--mute)}
.cnt{color:var(--mute);margin:0 0 10px;font-weight:600}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s}
.q{font-size:1.3rem;line-height:1.4;margin:0 0 18px;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px}
.opt.sel{background:var(--sel);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:650}
.opt.locked{cursor:default}
.opt.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.opt.right,.opt.right:hover{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong,.opt.wrong:hover{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:700}
.fb{margin:6px 0 0;padding:13px 15px;border-radius:14px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,transparent),color-mix(in srgb,var(--acc2) 16%,transparent));border-radius:16px;padding:14px 6px}
.stats b{display:block;font-size:1.7rem;font-weight:800}
.stats span{color:var(--mute);font-size:.85rem}
.verdict{margin-top:14px;padding:14px;border-radius:14px;font-weight:800;font-size:1.08rem;text-align:center}
.verdict.ok{background:var(--ok);color:#fff}.verdict.bad{background:var(--bad);color:#fff}
.item{border-left:5px solid var(--line);padding:10px 14px;margin-bottom:10px;border-radius:0 14px 14px 0}
.item.ok{border-color:var(--ok);background:var(--okbg)}.item.bad{border-color:var(--bad);background:var(--badbg)}
.item p{margin:0 0 6px;font-weight:650}.item small{display:block;color:var(--mute)}
.tag{display:inline-block;margin-bottom:6px;padding:2px 11px;border-radius:999px;font-size:.8rem;font-weight:800;color:#fff}
.item.ok .tag{background:var(--ok)}.item.bad .tag{background:var(--bad)}
@media (prefers-color-scheme:dark){.item.ok .tag,.nums button.r,.verdict.ok{color:#05210f}.item.bad .tag,.nums button.w,.verdict.bad{color:#2a0610}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const TITLE='Международные финансы ', MAX_MISTAKES=, QCOUNT=25, LIMIT=30*60; // 25 вопросов, 30 минут, Удачи 
const SHEET_URL='https://script.google.com/macros/s/AKfycbw4QsVxL7WNucx3nUm_bjENSvZUNEIM8ZBFaekDlb27Aqc8YMNczyzrRitYGoZ4SNiE/exec'; // ссылка веб-приложения Google Apps Script

const $=id=>document.getElementById(id);
// null и false пропускаются: атрибут не создаётся (так кнопка не блокируется по ошибке)
const h=(t,p,...k)=>{const e=document.createElement(t);for(const x in (p||{})){if(p[x]===null||p[x]===false)continue;if(x==='class')e.className=p[x];else if(x.startsWith('on'))e[x]=p[x];else e.setAttribute(x,p[x])}k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const mount=(...n)=>{$('app').replaceChildren(...n.flat().filter(Boolean));window.scrollTo(0,0)};

let bank=[],loaded=false,quiz=null,timer=null;

// отправка результата в Google Таблицу
function sendResult(r){
  if(!SHEET_URL||SHEET_URL.startsWith('ВСТАВЬТЕ'))return;
  try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(r)}).catch(()=>{})}catch(e){}
}

// ---------- старт ----------
function viewStart(){
  if(!loaded)return mount(h('h1',{},TITLE),h('p',{class:'hint'},'Загружаю вопросы…'));
  if(!bank.length)return mount(h('h1',{},TITLE),h('div',{class:'card'},h('p',{},'Не удалось загрузить вопросы. Проверьте, что файл questions.txt лежит рядом с index.html.')));
  const n=Math.min(QCOUNT,bank.length);
  let saved='';try{saved=localStorage.getItem('sname')||''}catch(e){}
  const inp=h('input',{class:'name',placeholder:'Фамилия и имя',maxlength:'60',value:saved,autocomplete:'name'});
  const go=()=>{const nm=inp.value.trim();if(!nm){inp.focus();return}try{localStorage.setItem('sname',nm)}catch(e){}startQuiz(nm)};
  inp.onkeydown=e=>{if(e.key==='Enter')go()};
  mount(h('h1',{},TITLE),h('div',{class:'card'},
    h('div',{class:'chips'},h('span',{},n+' вопросов'),h('span',{},'30 минут'),h('span',{},'Допустимо ошибок: '+MAX_MISTAKES)),
    h('p',{class:'hint'},'Выберите вариант и нажмите «Далее»: сразу увидите, верно ли ответили. Пока не нажали «Далее», ответ можно изменить. Номера вопросов справа помогут перейти к любому из них.'),
    inp,
    h('button',{class:'primary big',onclick:go},'Начать тест')));
}

function startQuiz(name){
  const qs=shuffle(bank).slice(0,QCOUNT).map(q=>({q:q.q,opts:shuffle(q.o.map((x,i)=>({t:x,ok:i===q.a})))}));
  quiz={active:true,name,qs,ans:new Array(qs.length).fill(-1),done:new Array(qs.length).fill(false),i:0,left:LIMIT};
  clearInterval(timer);
  timer=setInterval(()=>{quiz.left--;const e=$('timer');if(e){e.textContent=fmt(quiz.left);e.classList.toggle('low',quiz.left<=60)}if(quiz.left<=0)finish()},1000);
  renderQ();
}

function renderQ(){
  const{qs,i,ans,done}=quiz,q=qs[i],last=i===qs.length-1,isDone=done[i];
  const right=q.opts.find(o=>o.ok).t,good=isDone&&ans[i]>=0&&q.opts[ans[i]].ok;

  const nums=qs.map((_,n)=>{
    let c='';
    if(done[n])c=(ans[n]>=0&&qs[n].opts[ans[n]].ok)?'r':'w';else if(ans[n]>=0)c='has';
    if(n===i)c+=' cur';
    return h('button',{class:c.trim(),title:'Вопрос '+(n+1),onclick:()=>{quiz.i=n;renderQ()}},String(n+1));
  });
  const side=h('div',{class:'side'},h('div',{class:'card'},
    h('span',{class:'timer'+(quiz.left<=60?' low':''),id:'timer'},fmt(quiz.left)),
    h('div',{class:'nums'},nums),
    h('p',{class:'legend'},'Зелёный: верно · Красный: неверно · Закрашен: выбран ответ'),
    h('button',{style:'width:100%',onclick:()=>{
      const left=qs.filter((_,n)=>!done[n]).length;
      if(left===0||confirm('Не проверено вопросов: '+left+'. Завершить тест?'))finish();
    }},'Завершить тест')));

  const main=h('div',{},h('div',{class:'card'},
    h('p',{class:'cnt'},'Вопрос '+(i+1)+' из '+qs.length),
    h('div',{class:'bar'},h('i',{style:'width:'+((i+1)/qs.length*100)+'%'})),
    h('p',{class:'q'},q.q),
    q.opts.map((o,k)=>{
      let c='opt';
      if(isDone){c+=' locked';if(o.ok)c+=' right';else if(ans[i]===k)c+=' wrong'}
      else if(ans[i]===k)c+=' sel';
      return h('button',{class:c,onclick:()=>{if(quiz.done[i])return;quiz.ans[i]=k;renderQ()}},o.t);
    }),
    isDone?h('div',{class:'fb '+(good?'ok':'bad')},good?'Верно!':(ans[i]<0?'Ответа нет. ':'Неверно. ')+'Правильный ответ: '+right):null,
    h('div',{class:'nav'},
      h('button',{disabled:i===0?'':null,onclick:()=>{if(quiz.i>0){quiz.i--;renderQ()}}},'Назад'),
      isDone
        ?h('button',{class:'primary',onclick:()=>{last?finish():(quiz.i++,renderQ())}},last?'Завершить':'Следующий вопрос')
        :h('button',{class:'primary',disabled:ans[i]<0?'':null,onclick:()=>{if(quiz.ans[i]<0)return;quiz.done[i]=true;renderQ()}},'Далее'))));

  mount(h('div',{class:'layout'},main,side));
}

// ---------- результат ----------
function finish(){
  if(!quiz||!quiz.active)return;
  clearInterval(timer);quiz.active=false;
  const{qs,ans}=quiz,spent=LIMIT-Math.max(quiz.left,0);
  let ok=0;const items=[];
  qs.forEach((q,n)=>{
    const right=q.opts.find(o=>o.ok).t,has=ans[n]>=0,mine=has?q.opts[ans[n]].t:'нет ответа',g=has&&q.opts[ans[n]].ok;
    if(g)ok++;
    items.push(h('div',{class:'item '+(g?'ok':'bad')},
      h('span',{class:'tag'},g?'Верно':'Неверно'),
      h('p',{},(n+1)+'. '+q.q),
      h('small',{},'Ваш ответ: '+mine),
      g?null:h('small',{},'Правильный ответ: '+right)));
  });
  const wrong=qs.length-ok,pct=Math.round(ok/qs.length*100),passed=wrong<=MAX_MISTAKES;
  sendResult({name:quiz.name,ok,wrong,total:qs.length,pct,passed,time:fmt(spent)});
  mount(h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Результат теста'),
    h('div',{class:'stats'},h('div',{},h('b',{},ok+'/'+qs.length),h('span',{},'Результат')),h('div',{},h('b',{},pct+'%'),h('span',{},'Процент')),h('div',{},h('b',{},fmt(spent)),h('span',{},'Время'))),
    h('p',{},'Правильных ответов: '+ok+' · Неправильных ответов: '+wrong),
    h('div',{class:'verdict '+(passed?'ok':'bad')},passed?'Тест сдан':'Тест провален: ошибок больше '+MAX_MISTAKES)),
    h('h2',{},'Разбор всех вопросов'),items,
    h('button',{class:'primary',onclick:()=>{quiz=null;viewStart()}},'Пройти заново'));
}
window.addEventListener('beforeunload',e=>{if(quiz&&quiz.active){e.preventDefault();e.returnValue=''}});

// ---------- чтение questions.txt ----------
function parseQs(txt){
  const out=[];
  for(const line of txt.split('\n').map(l=>l.trim()).filter(Boolean)){
    const p=line.split('|').map(s=>s.trim()),a=parseInt(p[p.length-1],10),o=p.slice(1,-1);
    if(p.length<4||o.some(x=>!x)||!(a>=1&&a<=o.length))continue;
    out.push({q:p[0],o,a:a-1});
  }
  return out;
}
viewStart();
fetch('questions.txt',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  bank=parseQs(t.replace(/^\uFEFF/,'').replace(/\r/g,''));
}).catch(()=>{}).finally(()=>{loaded=true;if(!quiz)viewStart()});
</script>
</body>
</html>
